<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Design Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --fg:#f3f1ff; --muted:#a9a6c9; --accent:#7cf7d4; --bg:#07060f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ui { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:28px clamp(16px,4vw,56px); }
  nav { display:flex; justify-content:space-between; align-items:center; pointer-events:auto; gap:12px; flex-wrap:wrap; }
  .logo { font-weight:700; letter-spacing:.02em; font-size:18px; }
  .tabs { display:flex; gap:6px; background:rgba(127,127,160,.14); padding:4px; border-radius:999px; backdrop-filter:blur(10px); }
  .tabs button { all:unset; cursor:pointer; padding:8px 14px; border-radius:999px; font:600 13px 'Space Grotesk',sans-serif; color:inherit; opacity:.7; }
  .tabs button.on { background:var(--fg); color:var(--bg); opacity:1; }
  .hero { max-width:640px; margin-bottom:6vh; }
  .eyebrow { font:600 12px 'JetBrains Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:18px; }
  h1 { font-size:clamp(40px,7vw,92px); line-height:.95; letter-spacing:-.03em; margin-bottom:20px; }
  p.sub { font-size:clamp(15px,1.4vw,19px); color:var(--muted); max-width:480px; line-height:1.5; margin-bottom:26px; }
  .cta { pointer-events:auto; display:inline-flex; gap:10px; align-items:center; padding:14px 22px; border-radius:999px; background:var(--accent); color:var(--bg); font:600 15px 'Space Grotesk',sans-serif; text-decoration:none; }
  .ticker { font:400 12px 'JetBrains Mono',monospace; color:var(--muted); display:flex; gap:22px; flex-wrap:wrap; }
  .ticker b { color:var(--accent); font-weight:600; }
  .note { position:fixed; right:clamp(16px,4vw,56px); bottom:28px; max-width:300px; font:400 13px/1.5 'Space Grotesk',sans-serif; color:var(--muted); text-align:right; }
  .note strong { color:var(--fg); display:block; font-size:15px; margin-bottom:4px; }
  @media (max-width:700px){ .note{display:none} }

  /* direction themes */
  body[data-d="night"] { --fg:#f3f1ff; --muted:#a9a6c9; --accent:#7cf7d4; --bg:#07060f; }
  body[data-d="night"] h1 { font-family:'Space Grotesk',sans-serif; font-weight:600; }
  body[data-d="clay"]  { --fg:#2b2118; --muted:#7a6a5a; --accent:#ff7a59; --bg:#f6efe6; }
  body[data-d="clay"] h1 { font-family:'Fraunces',serif; font-weight:700; }
  body[data-d="blue"]  { --fg:#e8f0ff; --muted:#8aa0c8; --accent:#ffd166; --bg:#0b1b3a; }
  body[data-d="blue"] h1 { font-family:'Instrument Serif',serif; font-weight:400; font-style:italic; letter-spacing:-.01em; }
</style>
</head>
<body data-d="night">
<canvas id="c"></canvas>
<div class="ui">
  <nav>
    <div class="logo">studio<span style="color:var(--accent)">.</span></div>
    <div class="tabs">
      <button data-k="night" class="on">A · Night Shift</button>
      <button data-k="clay">B · Clay Studio</button>
      <button data-k="blue">C · Blueprint</button>
    </div>
  </nav>
  <div>
    <div class="hero">
      <div class="eyebrow" id="eb">● 6 agents on shift</div>
      <h1 id="h1">An agency that<br>never sleeps.</h1>
      <p class="sub" id="sub">Brief us in 15 minutes. Watch a team of AI agents research, design, write and ship your website — live — in 72 hours.</p>
      <a class="cta" href="#">Start a project →</a>
    </div>
    <div class="ticker" id="tk"></div>
  </div>
</div>
<div class="note" id="note"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const cam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
const camBase = new THREE.Vector3(14, 14, 14);
let zoom = 9;
function resize(){
  const w = innerWidth, h = innerHeight, a = w/h;
  renderer.setSize(w,h,false);
  zoom = a < 0.8 ? 12 : 8.5;
  cam.left=-zoom*a; cam.right=zoom*a; cam.top=zoom; cam.bottom=-zoom; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const mouse = {x:0,y:0};
addEventListener('pointermove', e => { mouse.x = e.clientX/innerWidth-.5; mouse.y = e.clientY/innerHeight-.5; });

// shared layout: desks in a 3x2 grid, offset right so text has room
const ROLES = ['Researcher','Strategist','Art Director','Copywriter','Developer','QA Critic'];
const desks = [];
for (let i=0;i<6;i++){ desks.push(new THREE.Vector3(((i%3)-1)*3.6 + 3, 0, (Math.floor(i/3)-.5)*4 - 1)); }
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

function makeAgents(n, build){
  return Array.from({length:n}, (_,i) => {
    const mesh = build(i);
    return { mesh, from:i%6, to:(i+2)%6, t:Math.random(), speed:.18+Math.random()*.12, wait:0 };
  });
}
function stepAgents(agents, dt, y=0, onArrive){
  for (const a of agents){
    if (a.wait>0){ a.wait-=dt; continue; }
    a.t += dt*a.speed;
    if (a.t>=1){ a.t=0; a.from=a.to; a.to=(a.to+1+Math.floor(Math.random()*4))%6; a.wait=.6+Math.random()*1.2; onArrive && onArrive(a); }
    const p = new THREE.Vector3().lerpVectors(desks[a.from], desks[a.to], ease(a.t));
    p.x += .9; p.z += .9;
    a.mesh.position.set(p.x, y + Math.sin(a.t*Math.PI)*.6, p.z);
  }
}

/* ---------- A: Night Shift (dark, neon, glowing) ---------- */
function night(){
  const s = new THREE.Scene(); s.background = new THREE.Color('#07060f'); s.fog = new THREE.Fog('#07060f', 18, 40);
  s.add(new THREE.AmbientLight('#4b3f8f', .6));
  const floor = new THREE.Mesh(new THREE.BoxGeometry(16,.3,12), new THREE.MeshStandardMaterial({color:'#110f22', roughness:.4, metalness:.6}));
  floor.position.set(3,-.15,-1); floor.receiveShadow = true; s.add(floor);
  const grid = new THREE.GridHelper(16, 16, '#2a2550', '#1a1736'); grid.position.set(3,.01,-1); s.add(grid);
  const colors = ['#7cf7d4','#a78bfa','#f472b6','#60a5fa','#facc15','#fb923c'];
  desks.forEach((d,i) => {
    const desk = new THREE.Mesh(new THREE.BoxGeometry(2,.5,1.2), new THREE.MeshStandardMaterial({color:'#1c1938', roughness:.3, metalness:.4}));
    desk.position.copy(d).setY(.25); desk.castShadow = true; s.add(desk);
    const screen = new THREE.Mesh(new THREE.BoxGeometry(1.2,.75,.06), new THREE.MeshBasicMaterial({color:colors[i]}));
    screen.position.set(d.x, .95, d.z-.35); s.add(screen);
    const l = new THREE.PointLight(colors[i], 6, 4); l.position.set(d.x, 1.3, d.z); s.add(l);
  });
  const agents = makeAgents(6, i => {
    const g = new THREE.Group();
    const orb = new THREE.Mesh(new THREE.SphereGeometry(.28, 32, 32), new THREE.MeshBasicMaterial({color:colors[i]}));
    const halo = new THREE.Mesh(new THREE.SphereGeometry(.5, 32, 32), new THREE.MeshBasicMaterial({color:colors[i], transparent:true, opacity:.15}));
    g.add(orb, halo); g.add(new THREE.PointLight(colors[i], 4, 3)); s.add(g); return g;
  });
  // light trails
  const trails = agents.map((a,i) => {
    const pts = Array.from({length:40}, () => new THREE.Vector3());
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({color:colors[i], transparent:true, opacity:.6}));
    s.add(line); return {pts, geo};
  });
  return { scene:s, update(dt){
    stepAgents(agents, dt, .9);
    agents.forEach((a,i) => { const tr = trails[i]; tr.pts.pop(); tr.pts.unshift(a.mesh.position.clone()); tr.geo.setFromPoints(tr.pts); });
  }};
}

/* ---------- B: Clay Studio (warm, soft, playful characters) ---------- */
function clay(){
  const s = new THREE.Scene(); s.background = new THREE.Color('#f6efe6');
  s.add(new THREE.HemisphereLight('#fff6ea', '#e8c9a8', 1.2));
  const sun = new THREE.DirectionalLight('#fff1dc', 2.2); sun.position.set(8,16,6); sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera, {left:-14,right:14,top:14,bottom:-14}); s.add(sun);
  const floor = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, .6, 64), new THREE.MeshStandardMaterial({color:'#f0dcc4', roughness:1}));
  floor.position.set(3,-.3,-1); floor.receiveShadow = true; s.add(floor);
  const pastel = ['#ff9f80','#9ad0c2','#f6c453','#b7a4f2','#86b6f6','#f49cbb'];
  const soft = c => new THREE.MeshStandardMaterial({color:c, roughness:.85});
  desks.forEach((d,i) => {
    const desk = new THREE.Mesh(new THREE.CapsuleGeometry(.45, 1.3, 8, 24), soft('#fffaf3'));
    desk.rotation.z = Math.PI/2; desk.position.copy(d).setY(.5); desk.castShadow = desk.receiveShadow = true; s.add(desk);
    const plant = new THREE.Mesh(new THREE.SphereGeometry(.32, 24, 24), soft('#7fbf7f')); plant.position.set(d.x+.9, 1.15, d.z); plant.castShadow = true; s.add(plant);
    const mug = new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.3,24), soft(pastel[i])); mug.position.set(d.x-.7, 1.1, d.z+.1); mug.castShadow = true; s.add(mug);
  });
  const agents = makeAgents(6, i => {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(.36, .5, 8, 24), soft(pastel[i])); body.castShadow = true;
    const eyeM = new THREE.MeshBasicMaterial({color:'#2b2118'});
    const e1 = new THREE.Mesh(new THREE.SphereGeometry(.05,12,12), eyeM); e1.position.set(-.12,.22,.33);
    const e2 = e1.clone(); e2.position.x = .12;
    g.add(body, e1, e2); s.add(g); return g;
  });
  return { scene:s, update(dt, t){
    stepAgents(agents, dt, .7);
    agents.forEach((a,i) => {
      const next = desks[a.to]; a.mesh.lookAt(next.x+.9, a.mesh.position.y, next.z+.9);
      a.mesh.scale.y = 1 + Math.sin(t*6+i)*.05;
    });
  }};
}

/* ---------- C: Blueprint (editorial, wireframe, task graph) ---------- */
function blue(){
  const s = new THREE.Scene(); s.background = new THREE.Color('#0b1b3a');
  const grid = new THREE.GridHelper(30, 60, '#2f4f8f', '#17305e'); grid.position.set(3,0,-1); s.add(grid);
  const line = c => new THREE.LineBasicMaterial({color:c});
  desks.forEach(d => {
    const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2,.6,1.2)), line('#9fb8e8'));
    box.position.copy(d).setY(.3); s.add(box);
    const scr = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.2,.75,.02)), line('#ffd166'));
    scr.position.set(d.x, 1.05, d.z-.35); s.add(scr);
  });
  // DAG edges between desks (the task graph)
  const edges = [[0,1],[1,2],[1,3],[2,4],[3,4],[4,5],[5,3]];
  const curves = edges.map(([a,b]) => {
    const p0 = desks[a].clone().setY(.8), p2 = desks[b].clone().setY(.8);
    const p1 = p0.clone().lerp(p2,.5).setY(2.6);
    const c = new THREE.QuadraticBezierCurve3(p0,p1,p2);
    s.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(c.getPoints(40)), new THREE.LineDashedMaterial({color:'#4f74c0', dashSize:.15, gapSize:.1})).computeLineDistances());
    return c;
  });
  const packets = Array.from({length:10}, (_,i) => {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(.16), new THREE.MeshBasicMaterial({color: i%3 ? '#ffd166' : '#ffffff'}));
    s.add(m); return { m, c:i%curves.length, t:Math.random(), v:.25+Math.random()*.25 };
  });
  const nodes = desks.map(d => { const r = new THREE.Mesh(new THREE.RingGeometry(.35,.42,40), new THREE.MeshBasicMaterial({color:'#ffd166', side:THREE.DoubleSide})); r.rotation.x=-Math.PI/2; r.position.copy(d).setY(.02); s.add(r); return r; });
  return { scene:s, update(dt, t){
    for (const p of packets){ p.t += dt*p.v; if (p.t>1){ p.t=0; p.c=Math.floor(Math.random()*curves.length); } p.m.position.copy(curves[p.c].getPoint(p.t)); p.m.rotation.y += dt*3; }
    nodes.forEach((n,i) => n.scale.setScalar(1 + .25*Math.max(0, Math.sin(t*2 + i))));
  }};
}

const COPY = {
  night: { eb:'● 6 agents on shift', h:'An agency that<br>never sleeps.', sub:'Brief us in 15 minutes. Watch a team of AI agents research, design, write and ship your website — live — in 72 hours.',
    note:'<strong>A · Night Shift</strong>Dark, neon, cinematic. Each agent is a glowing orb leaving light trails between desks. Feels premium + "AI-native". Ref: Awwwards AI SOTDs (Heron, Oryzo).' },
  clay:  { eb:'☕ Your new creative team', h:'Meet the team<br>behind your site.', sub:'Six friendly AI specialists who study your business first — then design something that actually looks like you.',
    note:'<strong>B · Clay Studio</strong>Warm, soft, playful. Little clay characters walk between desks. Friendly to non-tech small-business owners. Ref: claymorphism / 3D character sites.' },
  blue:  { eb:'◇ Every decision, on the record', h:'Watch your website<br>get made.', sub:'A transparent studio: every brief, draft and decision flows through a live task graph you can inspect.',
    note:'<strong>C · Blueprint</strong>Editorial and technical. Wireframe desks, a live task graph with packets flowing. Says "transparent + engineered". Great for a portfolio/dev audience.' },
};
const LOG = ['Researcher → read 214 Google reviews','Strategist → sitemap drafted (5 pages)','Art Director → palette locked','Copywriter → hero v3','Developer → preview build #12','QA → Lighthouse 98'];

const builders = { night, clay, blue };
let current = night(), key = 'night';
function setDir(k){
  key = k; current = builders[k](); document.body.dataset.d = k;
  const c = COPY[k];
  document.getElementById('eb').textContent = c.eb;
  document.getElementById('h1').innerHTML = c.h;
  document.getElementById('sub').textContent = c.sub;
  document.getElementById('note').innerHTML = c.note;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.k===k));
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setDir(b.dataset.k));
setDir('night');

const tk = document.getElementById('tk'); let li = 0;
setInterval(() => { tk.innerHTML = [0,1,2].map(j => { const s = LOG[(li+j)%LOG.length].split(' → '); return `<span><b>${s[0]}</b> → ${s[1]}</span>`; }).join(''); li++; }, 1800);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  current.update(dt, t);
  cam.position.set(camBase.x + mouse.x*3, camBase.y - mouse.y*2, camBase.z - mouse.x*3);
  cam.lookAt(1.5, 0, -1);
  renderer.render(current.scene, cam);
});
</script>
</body>
</html>
