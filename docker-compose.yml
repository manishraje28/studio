# Local Postgres for development and tests. Production uses Supabase (also Postgres).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
